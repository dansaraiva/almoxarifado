spring:
  application:
    name: almoxarifado-api
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs

jwt:
  secret: ${JWT_SECRET:troque-este-segredo-em-producao-minimo-32-caracteres}
  expiration-minutes: 120

logging:
  level:
    com.escola.almoxarifado: INFO
